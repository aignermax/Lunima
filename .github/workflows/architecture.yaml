name: Architecture guardrails

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-size:
    name: Source size and guard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source guards, hook installation and safe test selection
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Check every tracked source file
        run: python3 scripts/check_source_size.py
