name: Release signing tooling

on:
  pull_request:
    paths:
      - 'scripts/release/**'
      - 'CAP-DataAccess/Updates/**'
      - '.github/workflows/Build_Exe.yaml'
      - '.github/workflows/ReleaseSigningTests.yaml'
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signer-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified pinned dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/release/requirements.txt
      - name: Exercise publisher envelope and source identity with disposable test keys
        run: python -m unittest discover -s scripts/release/tests -p 'test_*.py' -v
