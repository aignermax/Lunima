name: 🔍 xUnit Tests

# Pipeline (see docs/TESTING.md → "CI test pipeline"):
#   changes    — decides which shards this run needs (scripts/ci/select_test_shards.py)
#   tests      — one job per shard, each on its own runner (scripts/ci/test-shards.json)
#   partition  — proves the shard filters still partition the suite
#   xunit      — "🔍 xUnit Tests", the single required status check; aggregates the rest
#
# Pull requests skip [Trait("Category", "Heavy")] tests and, for docs-only changes,
# every shard. Pushes to dev/main, release tags, the nightly schedule and manual
# runs always execute the full suite including Heavy, so anything a PR run skipped
# is caught right after merge.
on:
  push:
    branches: [dev, main]
    # Every release tag runs the suite on exactly the tagged commit.
    tags: ['v*']
  pull_request:
  schedule:
    # Nightly full run (Heavy included) on the integration branch, catches flakes
    # and anything that slipped through between pushes.
    - cron: '30 2 * * *'
  # On-demand full runs, e.g. to tell a red PR apart from an already-red dev.
  workflow_dispatch:

# A newer push to the same PR supersedes the running check; branch pushes queue.
concurrency:
  group: xunit-${{ github.event.pull_request.number || (github.event_name == 'schedule' && 'nightly') || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  # Scheduled runs start on the default branch; the nightly is meant for dev.
  CHECKOUT_REF: ${{ github.event_name == 'schedule' && 'dev' || '' }}

jobs:
  changes:
    name: 🧭 Select test shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.select.outputs.run }}
      mode: ${{ steps.select.outputs.mode }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          # On pull_request HEAD is the merge commit; HEAD^1 is the base tip.
          fetch-depth: 2

      - name: Enforce authored source size
        run: python3 scripts/check_source_size.py

      - name: 🧭 Select shards
        id: select
        run: python3 scripts/ci/select_test_shards.py --event "${{ github.event_name }}"

  tests:
    name: 🧪 ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A shard takes ~5–10 min of tests plus ~4 min setup; beyond 30 min it hangs.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: 💽 Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 🗃️ Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.*', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 📦 Restore Dependencies
        run: dotnet restore UnitTests/UnitTests.csproj

      # Each shard builds for itself: a ~1.5 min build is cheaper than uploading
      # and downloading the test output (Avalonia/Skia natives) as an artifact.
      - name: 🔨 Build
        run: dotnet build UnitTests/UnitTests.csproj --no-restore

      - name: 🧰 Setup test tools
        id: tools
        uses: ./.github/actions/setup-test-tools
        with:
          simulation-tools: ${{ matrix.simulationTools }}

      - name: 🏃 Run xUnit Tests (${{ matrix.name }})
        working-directory: UnitTests
        env:
          SHARD_NAME: ${{ matrix.name }}
          SHARD_FILTER: ${{ matrix.filter }}
          # actions/setup-python installs into /opt/hostedtoolcache, not /usr/bin.
          # FindWorkingPython3 checks this env var first so the test subprocess
          # uses the same interpreter nazca/klayout were pip-installed into.
          LUNIMA_TEST_PYTHON3: ${{ steps.tools.outputs.python-path }}
          # Force matplotlib + Qt to non-interactive backends — Nazca's import
          # chain pulls these in and would otherwise wait for a display.
          MPLBACKEND: Agg
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          # Tests inside the process run serially (xunit.runner.json: the Avalonia
          # headless app is a process-wide singleton). Slow UI classes keep their
          # own shard: mixing them with other classes deadlocked on the Linux
          # runner (xUnit runs a collection inline on whichever thread finishes a
          # class fixture, and Avalonia's headless test case blocks that thread).
          echo "Filter: $SHARD_FILTER"
          mkdir -p TestResults
          # A test hanging past 5 min aborts the shard with the test's name in the
          # log instead of eating the job budget; no dump, to keep the artifact small.
          dotnet test --no-build --filter "$SHARD_FILTER" \
            --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none \
            --results-directory TestResults \
            --logger "trx;LogFileName=${SHARD_NAME}.trx" \
            --logger "console;verbosity=minimal" \
            2>&1 | tee "TestResults/${SHARD_NAME}.log"

      - name: 📎 Upload TestResults (hang diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testresults-${{ matrix.name }}
          path: UnitTests/TestResults/
          if-no-files-found: ignore
          retention-days: 7

  partition:
    name: 🧮 Shard partition check
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: 💽 Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 🗃️ Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.*', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 🔨 Build
        run: |
          dotnet restore UnitTests/UnitTests.csproj
          dotnet build UnitTests/UnitTests.csproj --no-restore

      - name: 🧮 Every test in exactly one shard
        run: python3 scripts/ci/check_test_shards.py

  xunit:
    # The required status check (rulesets "PR only" and "dev integration") — keep
    # this name. Shards skipped by the change selection count as success.
    name: 🔍 xUnit Tests
    needs: [changes, tests, partition]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ✅ Aggregate shard results
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          MODE: ${{ needs.changes.outputs.mode }}
          TESTS: ${{ needs.tests.result }}
          PARTITION: ${{ needs.partition.result }}
        run: |
          echo "changes=$CHANGES run=$RUN mode=$MODE tests=$TESTS partition=$PARTITION"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Shard selection did not succeed ($CHANGES)."; exit 1
          fi
          if [ "$RUN" != "true" ]; then
            if [ "$TESTS" = "skipped" ] && [ "$PARTITION" = "skipped" ]; then
              echo "Docs-only change — no test shard needed."; exit 0
            fi
            echo "::error::Shards ran although none were selected."; exit 1
          fi
          if [ "$TESTS" != "success" ]; then
            echo "::error::At least one test shard failed or was cancelled ($TESTS)."; exit 1
          fi
          if [ "$PARTITION" != "success" ]; then
            echo "::error::The shard filters no longer partition the suite ($PARTITION)."; exit 1
          fi
          echo "All selected shards passed ($MODE mode)."
