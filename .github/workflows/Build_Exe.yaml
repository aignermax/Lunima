name: Build & Publish

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types:
      - release-from-auto-tag
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    # Safety net: the sharded suite takes ~20 min; a hang must not eat the 6-h default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Python tooling mirrors xUnitTests.yaml so the same integration tests
      # that run on push/PR also run on the release-build path. Without this
      # the SiEPIC PdkOffset tests skip silently here (graceful skip), which
      # means the release build never actually validates the SiEPIC render
      # path that's the core of this release.
      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Nazca + KLayout + SiEPIC PDK + gdstk (for PdkOffset tests)
        run: |
          set -euo pipefail
          pip install gdstk klayout siepic_ebeam_pdk
          pip install "https://github.com/aignermax/Lunima/releases/download/vendor-cache-nazca-0.6.1/nazca-0.6.1.tar.gz"
          python3 -c "import nazca, nazca.demofab, gdstk, klayout.db, siepic_ebeam_pdk; print('PDK preview deps ok')"

      # Mirrors the step in xUnitTests.yaml: the klayout pip wheel ships only the
      # Python module, but the foundry-deck DRC tests probe a `klayout` executable.
      - name: Install KLayout CLI (for foundry-deck DRC tests)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y klayout
          klayout -v

      # The full suite, Category=Heavy included (these filters never exclude it); the
      # tag push also runs the sharded xUnitTests.yaml on the same commit. A single unfiltered
      # `dotnet test` mixes the slow Avalonia-headless UI classes with the rest in one
      # process, which deadlocks on the Linux runner; the v0.15.0 release build hung in
      # this step until it was cancelled. The script lives inline (not in scripts/)
      # because a dispatched release checks out the tagged commit, which may predate it.
      - name: Test
        working-directory: UnitTests
        env:
          LUNIMA_TEST_PYTHON3: ${{ steps.setup-python.outputs.python-path }}
          MPLBACKEND: Agg
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          dotnet build --no-restore
          mkdir -p TestResults
          run_shard() {
            local name="$1" filter="$2"
            dotnet test --no-build --filter "$filter" \
              --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none \
              --results-directory TestResults \
              --logger "console;verbosity=minimal" \
              > "TestResults/${name}.log" 2>&1
          }
          run_shard fast      'Category!=Slow' &
          run_shard slow-ui   'Category=Slow&FullyQualifiedName~UnitTests.UI.' &
          run_shard slow-core 'Category=Slow&FullyQualifiedName!~UnitTests.UI.' &
          status=0
          for pid in $(jobs -p); do wait "$pid" || status=1; done
          for log in TestResults/*.log; do echo "===== $log ====="; cat "$log"; done
          exit $status

  build:
    name: Build ${{ matrix.rid }}
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: Lunima-win-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: Lunima-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        run: >
          dotnet publish CAP.Desktop/CAP.Desktop.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish

      - name: Rename executable
        run: |
          cd publish
          if [ -f CAP.Desktop ]; then
            mv CAP.Desktop Lunima
            chmod +x Lunima
          fi
          if [ -f CAP.Desktop.exe ]; then
            mv CAP.Desktop.exe Lunima.exe
          fi
        shell: bash

      # Ship the repo's example designs beside the binary so the Home screen's
      # Examples section (walk-up discovery from the app base directory) also
      # works in the portable zip/tar layout, not just the dev tree.
      - name: Bundle example designs
        run: cp -r examples publish/examples
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: publish/

  build-msi:
    name: Build MSI Installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Extract version from csproj
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content CAP.Desktop/CAP.Desktop.csproj
          $version = $csproj.Project.PropertyGroup.Version
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Extracted version: $version"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install Pillow

      - name: Generate Lunima icon
        run: python scripts/generate_icon.py --output Installer/LunimaIcon.ico

      - name: Install WiX Toolset
        run: dotnet tool install --global wix --version 4.0.5

      - name: Install WiX extensions
        run: |
          wix extension add WixToolset.UI.wixext/4.0.5
          wix extension add WixToolset.NetFx.wixext/4.0.5

      - name: Publish app for MSI
        run: >
          dotnet publish CAP.Desktop/CAP.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/win-x64-msi

      # Examples must land in the publish dir BEFORE harvesting so the MSI
      # installs them next to CAP.Desktop.exe (same discovery as portable).
      - name: Bundle example designs
        run: cp -r examples publish/win-x64-msi/examples
        shell: bash

      - name: Generate HarvestedFiles.wxs
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File Installer/Generate-HarvestedFiles.ps1 -PublishDir publish/win-x64-msi -OutputFile HarvestedFiles.wxs

      - name: Build MSI
        shell: pwsh
        run: |
          $publishPath = "${{ github.workspace }}\publish\win-x64-msi\"
          dotnet build Installer/Installer.wixproj -c Release -p:PublishDir=$publishPath -p:ProductVersion=${{ steps.version.outputs.version }}

      - name: Rename MSI with version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Copy-Item Installer/bin/Release/Lunima-Setup.msi "Lunima-Setup-$version.msi"
          echo "Created Lunima-Setup-$version.msi"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lunima-MSI-Installer
          path: Lunima-Setup-*.msi

  build-macos:
    name: Build macOS .dmg (${{ matrix.rid }})
    needs: test
    strategy:
      matrix:
        include:
          # Both slices build on the Apple-Silicon runner. The x64 slice is cross-compiled
          # via `dotnet publish -r osx-x64` (the bundle script never runs the produced binary,
          # and hdiutil/.dmg packaging is arch-agnostic). This avoids the macos-13 Intel
          # runners, which are scarce/deprecated — the x64 job previously queued 24h with no
          # runner and was auto-cancelled, skipping the release.
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Extract version from csproj
        id: version
        run: |
          version=$(grep '<Version>' CAP.Desktop/CAP.Desktop.csproj | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/' | xargs)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $version"

      - name: Setup Python (for .icns generation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Best-effort icon: build_macos_bundle.sh also falls back to generating one,
      # and ships without a custom icon if Pillow/iconutil are unavailable.
      - name: Generate macOS app icon (.icns)
        run: |
          python3 -m pip install --upgrade Pillow
          python3 scripts/generate_icon.py --icns Installer/LunimaIcon.icns
        continue-on-error: true

      - name: Build Lunima.app bundle (self-contained, unsigned)
        run: bash scripts/build_macos_bundle.sh ${{ matrix.rid }}

      # Unsigned .dmg with an /Applications drop-target. Signing/notarization is a
      # follow-up gated on an Apple Developer ID + CI secrets (none configured yet);
      # users clear quarantine with `xattr -dr com.apple.quarantine` on first launch.
      - name: Package unsigned .dmg
        run: |
          DMG="Lunima-${{ steps.version.outputs.version }}-${{ matrix.rid }}.dmg"
          STAGING="$(mktemp -d)"
          cp -R dist/Lunima.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Lunima" -srcfolder "$STAGING" -ov -format UDZO "$DMG"
          echo "Created $DMG"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lunima-${{ matrix.rid }}-dmg
          path: Lunima-*-${{ matrix.rid }}.dmg

      # Zipped .app for the in-place auto-updater (issue #614). ditto preserves the bundle's
      # symlinks / extended attributes / signature seal so the on-disk bytes stay valid; the
      # .dmg above remains the artifact for first-time manual installs.
      - name: Package .app zip (for in-place auto-update)
        run: |
          ZIP="Lunima-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/Lunima.app "$ZIP"
          echo "Created $ZIP"

      - name: Upload .zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lunima-${{ matrix.rid }}-zip
          path: Lunima-*-${{ matrix.rid }}.zip

  release:
    name: Create Release
    needs: [build, build-msi, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Configure required reviewers and protected release refs before provisioning the key.
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || github.ref }}
          # Full history (not a shallow depth-1 clone) so the changelog step's
          # `git log <prev-tag>..<curr-tag>` can see every commit in the range.
          # With the default shallow checkout only the tip commit is present, so
          # the v0.9.0 notes listed a single commit instead of the whole release.
          fetch-depth: 0

      - name: Setup publisher tooling
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned signing dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/release/requirements.txt

      - name: Verify signing tooling with disposable test keys
        run: python -m unittest discover -s scripts/release/tests -p 'test_*.py' -v

      - name: Compute release info
        id: info
        run: python -m scripts.release.prepare_release

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: Lunima-win-x64
          path: win-x64

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: Lunima-linux-x64
          path: linux-x64

      - name: Download MSI installer
        uses: actions/download-artifact@v4
        with:
          name: Lunima-MSI-Installer
          path: msi

      - name: Download macOS .dmg builds
        uses: actions/download-artifact@v4
        with:
          pattern: Lunima-*-dmg
          path: dmg
          merge-multiple: true

      - name: Download macOS .zip builds
        uses: actions/download-artifact@v4
        with:
          pattern: Lunima-*-zip
          path: zip
          merge-multiple: true

      - name: Create archives
        run: |
          cd win-x64 && zip -r ../Lunima-${{ steps.info.outputs.version }}-win-x64.zip . && cd ..
          cd linux-x64 && tar czf ../Lunima-${{ steps.info.outputs.version }}-linux-x64.tar.gz . && cd ..

      - name: Stage the exact release inventory
        env:
          RELEASE_VERSION: ${{ steps.info.outputs.version }}
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          from scripts.release.sign_manifest import expected_assets, artifact_inventory
          version = os.environ['RELEASE_VERSION']
          target = Path('release-assets')
          target.mkdir()
          for name in expected_assets(version):
              directory = 'msi' if name.endswith('.msi') else 'dmg' if name.endswith('.dmg') else 'zip' if '-osx-' in name else '.'
              source = Path(directory) / name
              if source.is_symlink() or not source.is_file():
                  raise ValueError('Expected a regular build artifact')
              shutil.copyfile(source, target / name)
          artifact_inventory(target, version)
          PY

      - name: Sign stable publisher manifest
        if: steps.info.outputs.stable == 'true'
        env:
          # Only this step receives the secret. Never echo it, pass it as argv, or write it to disk.
          LUNIMA_RELEASE_SIGNING_KEY_PEM: ${{ secrets.LUNIMA_RELEASE_SIGNING_KEY_PEM }}
          KEY_ID: ${{ vars.LUNIMA_RELEASE_SIGNING_KEY_ID }}
          RELEASE_VERSION: ${{ steps.info.outputs.version }}
          RELEASE_TAG: ${{ steps.info.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.info.outputs.commit }}
          EXPECTED_COMMIT: ${{ steps.info.outputs.expected_commit }}
          TAG_COMMIT: ${{ steps.info.outputs.tag_commit }}
        run: |
          python -m scripts.release.sign_manifest --directory release-assets \
            --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" \
            --expected-commit "$EXPECTED_COMMIT" --tag-commit "$TAG_COMMIT" \
            --key-id "$KEY_ID" --output release-assets/release-manifest.json

      - name: Generate Changelog
        id: changelog
        env:
          SOURCE_COMMIT: ${{ steps.info.outputs.commit }}
        run: |
          # Get the previous release tag: the highest semantic-version tag (vMAJOR.MINOR.PATCH)
          # that is NOT the current one. The old "head -2 | tail -1" assumed the current tag was
          # the newest in the list, but non-release tags (e.g. "vendor-cache-nazca-0.6.1") sort
          # to the top under -version:refname and pushed the current tag into the tail position —
          # producing a bogus "0 commits since vX..vX" changelog. Restricting to vX.Y.Z tags
          # ignores vendor/build/cache tags entirely.
          git fetch --tags
          CURR_TAG="${{ steps.info.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$CURR_TAG" | head -1)

          echo "Generating changelog from $PREV_TAG to $CURR_TAG"

          # Get commits since last release tag
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG..$SOURCE_COMMIT" --pretty=format:"- %s" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s" --no-merges | head -20)
          fi

          # Categorize commits. This repo uses symbol prefixes — (+) new, (!) breaking,
          # (-) removed, (=) bugfix, (*) feature+fix, (~) refactor, (c) chore — so match those
          # first, plus conventional-commit words as a fallback (fork/agent PRs use them).
          PAT_FEAT='^- (\(\+\)|feat|feature|add|implement)'
          PAT_FIX='^- (\(=\)|\(\*\)|fix|bugfix)'
          PAT_IMPR='^- (\(~\)|\(c\)|\(-\)|refactor|improve|update|enhance|chore)'
          PAT_BREAK='(^- \(!\)|BREAKING|breaking change)'

          FEATURES=$(echo "$COMMITS" | grep -iE "$PAT_FEAT" || true)
          FIXES=$(echo "$COMMITS" | grep -iE "$PAT_FIX" || true)
          IMPROVEMENTS=$(echo "$COMMITS" | grep -iE "$PAT_IMPR" || true)
          BREAKING=$(echo "$COMMITS" | grep -iE "$PAT_BREAK" || true)
          OTHER=$(echo "$COMMITS" | grep -viE "$PAT_FEAT|$PAT_FIX|$PAT_IMPR|^- \(!\)" || true)

          # Build changelog sections
          CHANGELOG=""

          if [ -n "$FEATURES" ]; then
            CHANGELOG+="### ✨ New Features"$'\n'"$FEATURES"$'\n\n'
          fi

          if [ -n "$FIXES" ]; then
            CHANGELOG+="### 🐛 Bug Fixes"$'\n'"$FIXES"$'\n\n'
          fi

          if [ -n "$IMPROVEMENTS" ]; then
            CHANGELOG+="### 🔧 Improvements"$'\n'"$IMPROVEMENTS"$'\n\n'
          fi

          if [ -n "$BREAKING" ]; then
            CHANGELOG+="### ⚠️ Breaking Changes"$'\n'"$BREAKING"$'\n\n'
          fi

          if [ -n "$OTHER" ] && [ $(echo "$OTHER" | wc -l) -gt 0 ]; then
            CHANGELOG+="### 📝 Other Changes"$'\n'"$OTHER"$'\n\n'
          fi

          # Save to output (use delimiter for multiline)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: Lunima v${{ steps.info.outputs.version }}
          target_commitish: ${{ steps.info.outputs.commit }}
          prerelease: ${{ steps.info.outputs.stable != 'true' }}
          fail_on_unmatched_files: true
          body: |
            ${{ steps.info.outputs.stable == 'true' && 'Publisher-authenticated release: release-manifest.json binds all seven artifacts to this source commit.' || 'Manual build / prerelease: no stable publisher manifest; manual download only. Automatic updates will not install this build.' }}

            ${{ steps.changelog.outputs.changelog }}

            ## 📦 Installation

            ### Windows (Recommended - MSI Installer)
            1. Download `Lunima-Setup-${{ steps.info.outputs.version }}.msi`
            2. Run the installer
            3. Desktop shortcut and Start Menu entry will be created automatically

            **Requirements:** .NET 10 Runtime (x64) - installer will check and prompt if missing

            ### Windows (Portable)
            1. Download `Lunima-${{ steps.info.outputs.version }}-win-x64.zip`
            2. Extract and run `Lunima.exe`

            ### Linux
            1. Download `Lunima-${{ steps.info.outputs.version }}-linux-x64.tar.gz`
            2. Extract: `tar xzf Lunima-*.tar.gz`
            3. Run: `./Lunima`

            ### macOS (Apple Silicon & Intel)
            1. Download `Lunima-${{ steps.info.outputs.version }}-osx-arm64.dmg` (Apple Silicon) or `Lunima-${{ steps.info.outputs.version }}-osx-x64.dmg` (Intel)
            2. Open the `.dmg` and drag **Lunima** into Applications
            3. These builds are **unsigned**. On first launch, clear the quarantine flag:
               ```bash
               xattr -dr com.apple.quarantine /Applications/Lunima.app
               ```
               (or right-click the app → **Open** → **Open** to bypass Gatekeeper once)

            No .NET installation required for portable versions — everything is included.

            ---
            **Commit:** ${{ steps.info.outputs.commit }}
          files: |
            release-assets/*
